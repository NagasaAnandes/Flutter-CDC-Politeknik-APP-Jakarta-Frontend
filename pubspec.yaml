name: flutter_cdc_poltek_app_frontend
description: "CDC Politeknik APP Jakarta"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  go_router: ^17.0.1
  bloc: ^9.2.0
  shared_preferences: ^2.5.4
  flutter_launcher_icons: ^0.14.4
  flutter_bloc: ^9.1.1
  url_launcher: ^6.3.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/images/Logo_CDC.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/Logo_CDC.png
